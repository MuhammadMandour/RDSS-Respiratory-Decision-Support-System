# Development override. Usage (PowerShell):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Differences from the base file:
#  * dev Spring profile, demo seed data and Swagger UI enabled
#  * postgres, orthanc (web UI + DICOM port) and the backend are published on 127.0.0.1 only

services:
  postgres:
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-15432}:5432"
    # Published ports need a non-internal network to be reachable from the host.
    networks: [internal, devhost]

  orthanc:
    ports:
      - "127.0.0.1:${DEV_ORTHANC_HTTP_PORT:-18042}:8042"
      - "127.0.0.1:${DEV_ORTHANC_DICOM_PORT:-14242}:4242"
    networks: [internal, devhost]

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SEED_DEMO_DATA: "true"
      API_DOCS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      HL7_MLLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-18081}:8080"
      # HL7 MLLP listener (dev only, loopback). MLLP is unauthenticated: never expose it publicly.
      - "127.0.0.1:${DEV_HL7_MLLP_PORT:-12575}:2575"

networks:
  devhost: {}
